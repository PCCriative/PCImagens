<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio | Paulo Costa Fotografia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container-header">
      <a href="index.html" class="logo">
        <img src="imagens/logo.png" alt="Paulo Costa Fotografia Logo">
      </a>
      <nav class="menu-principal">
        <ul>
          <li><a href="index.html">Página Inicial</a></li>
          <li><a href="portfolio.html">Portfólio</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="home-page">
    <section class="carrossel-container">
      <button id="prev">&#10094;</button>
      <div class="carrossel-slide">
        <img id="carrossel-foto" src="" alt="">
        <div id="album-nome"></div>
      </div>
      <button id="next">&#10095;</button>
    </section>

    <section class="portfolio-list">
      <h2>Portfólio</h2>
      <div class="album-list" id="album-list">
        <!-- Os álbuns serão preenchidos pelo JS -->
      </div>
    </section>
  </main>

  <!-- Modal de visualização das fotos -->
  <div id="modal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modal-img">
    <div id="modal-caption"></div>
    <a class="modal-prev">&#10094;</a>
    <a class="modal-next">&#10095;</a>
  </div>

  <footer>
    <div class="container-footer">
      <p>&copy; 2025 Paulo Costa Fotografia. Todos os direitos reservados.</p>
      <div class="social-links">
        <a href="https://wa.me/5521989879136" target="_blank">Telefone</a>
        <a href="https://www.facebook.com/pccriativedigital/" target="_blank">Facebook</a>
        <a href="mailto:pccriativedigital@gmail.com">E-mail</a>
      </div>
    </div>
  </footer>

  <script src="js/carrossel.js"></script>
</body>
</html>
